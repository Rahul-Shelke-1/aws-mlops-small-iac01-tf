name: Test and Preview Build Docs

on:
  pull_request:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - '.github/workflows/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/docs-preview.yml'

jobs:
  test-build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      deployments: write
      pull-requests: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Test MkDocs Strict Build
        run: |
          # The --strict flag treats warnings (like broken internal links) as errors
          uv run mkdocs build

      - name: Upload HTML Preview Artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: docs-html-preview
          path: site/ # The folder generated by mkdocs build

      - name: Publish Preview to Cloudflare Workers
        id: cloudflare_deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.136.3"
          command: preview --config ./wrangler.jsonc --worker-name ${{ secrets.CLOUDFLARE_WORKER_NAME }} --name pr-${{ github.event.pull_request.number }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Comment PR with Preview URL
        uses: mshick/add-pr-comment@v2
        with:
          message: |
            ### Documentation Preview Deployed!

            | Environment | Link |
            | :--- | :--- |
            | **Cloudflare Workers Preview** | [View Preview](${{ steps.cloudflare_deploy.outputs.preview-url }}) |

            Built from commit ${{ github.event.pull_request.head.sha }}.
